openQuestions:
  - posted: "2026-05-20"
    question: "Is this John Vining the same person as the \"Jean-Baptiste 'John' Vining (1851–1934)\" appearing in third-party Ancestry trees?"
    background: "An Ancestry profile names a Jean-Baptiste \"John\" Vining of Patterson, St. Mary Parish, LA, born 20 August 1851, died 12 July 1934. The death date matches the gravestone exactly. However, the gravestone gives age 84, which implies a birth ca. 1850, not 1851 — a one-year discrepancy. Need a primary birth or baptism record."
