openQuestions:
  - posted: "2026-05-03"
    question: "Who was Russell's biological father?"
    background: "Russell was born 28 August 1896, when his mother Orpha was 16 and unmarried. Orpha married David Frayer five years later (23 September 1901). Russell carried his mother's surname. The 1900 census shows him as \"nephew\" in another Vining household with Orpha as \"servant\"; his 1918 WWI draft card names Orpha as next of kin and lists no father."
  - posted: "2026-05-03"
    question: "When and where did Russell die, and where is he buried?"
    background: "Two competing dates currently recorded: 23 August 1962 or December 1972. Place of death and burial unknown."
