leads:
  - posted: "2026-05-09"
    note: "Family Bible (Vining-Hunt) acquired from a bookseller in May 2026 — likely an Isaac Collins (Trenton, NJ) printing of the late 18th century. Bible belonged to Asa and Sarah (Hunt) Vining and their children Martin, David, and Sally Vining of Hawley, Massachusetts. Once received, transcribe the family record pages — likely fills the 10-year gap between David (b. 1799) and Sally (b. 1809), Martin's missing marriage/death, Sally's marriage status, and possible Hunt-family detail. May also include 1848 Abington map (with penciled ownership of Mrs. Anna H. Vining of East Weymouth) sold separately"
