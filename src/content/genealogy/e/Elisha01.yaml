openQuestions:
  - posted: "2026-05-03"
    question: "Are there other unrecorded children of Elisha and Mary Leavitt?"
    background: "Daughter Celia (bapt. 1758) was added to this family from <a href='https://congregationallibrary.quartexcollections.com/Documents/Detail/church-records-1750-1774-first-congregational-church-in-abington-mass./40726'>Abington First Church baptism records, 1750-1774</a>. Her parentage to Elisha and Mary Leavitt is inferred from the Abington church and from her daughter's middle name (Leavitt), not from any direct documentary evidence — we still need to verify these are the correct parents to associate her with."
