  - posted: "2026-05-11"
    question: "Is the David N. Vining (age 5) in Kie's 1950 census household the same person as &#8220;Frank Vining&#8221; in the current child list, or a separate child not yet recorded?"
    background: "The 1950 US census shows Kie Vining's household with children Kie Jr., Lucille (15), Ernest (13), Ruby L. (10), James W. (7), and David N. (5). The current entry lists James and Frank with no birth info; James W. (7) appears to match James, but David N. (5) does not obviously match Frank. Possible explanations: David is a separate child missing from the entry, Frank is a nickname/middle name for David, or one of the names is a transcription error."
