  - type: death
    items:
      - caption: >-
          Cemetery lot for Benjamin Vining's family, in Pond Cemetery, Wales, Maine. Left to right, the stones belong to
          Rhoda (2nd wife), John (son), Hannah (1st wife), ? [a small rough natural stone], Benjamin, and George W.
          Purington. Purington's stone was included in the picture because of its proximity to Benjamin's stone and
