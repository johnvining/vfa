    entries:
      - year: "1900"
        caption: >-
          Taylor, Cortland County, New York - dwelling 134, family 139. According to the 1900 census, Esther had given
          birth to 8 children, 3 of whom were dead as of that census date.
        images:
          - src: BenjaminL02census1900.jpg
      - year: "1910"
        caption: >-
          Cincinnatus, Cortland County, New York - dwelling 237, family 253. According to the 1910 census, Esther had
          given birth to 12 children, 5 of whom were dead as of that census date.
        images:
          - src: BenjaminL02census1910.jpg
      - year: "1920"
        caption: Cincinnatus, Cortland County, New York - dwelling 137, family 147
        images:
          - src: BenjaminL02census1920.jpg
      - year: "1930"
        caption: >-
          Cincinnatus, Cortland County, New York - dwelling [unnumbered], family 71. Also living in this household in
          1930 was Mad[e]line E. Parker (12 y., b. New York, likely a granddaughter of Benjamin L. and Esther even
          though the census reported that she was their "daughter").
        images:
          - src: BenjaminL02census1930.jpg
