    entries:
      - year: "1800"
        caption: >-
          Durham, Cumberland County [Durham is now in Androscoggin County], Maine - Also living in this household in
          1800 were a male (45 and over) and a female (45 and over).
        images:
          - src: Bela01census1800.jpg
      - year: "1810"
        caption: >-
          Durham, Cumberland County [Durham is now in Androscoggin County], Maine - No male 10–16 was reported for this
          household in 1810. Also living in this household in 1810 were a male (45 and over) and a female (45 and over).
        images:
          - src: Bela01census1810.jpg
      - year: "1820"
        caption: >-
          Durham, Cumberland County [Durham is now in Androscoggin County], Maine - One female under 10 and two females
          10–16 were reported for this household in 1820. Mary Millbanks (10) and Sarah (15) were likely the two who
          were 10–16. This leaves an unknown female under 10 in this household. If Mary Millbanks had been reported as a
          female under 10, this would leave an unknown female 10–16 in this household in 1820. Lucy was 22 by then and,
          although not married until 30 November 1820, would likely not be listed as 10–16.
        images:
          - src: Bela01census1820.jpg
      - year: "1830"
        caption: >-
          Durham, Cumberland County [Durham is now in Androscoggin County], Maine - No females were reported for this
          household in 1830. An unknown male 10–15 was reported for this household. Only one male 20–30 was reported for
          this household. That could have been either Sewall (22) or Samuel (28), likely Sewall as there was a Samuel (M
          30–45) listed as a head of the household in Durham in 1830.
        images:
          - src: Bela01census1830.jpg
      - year: "1840"
        caption: Durham, Cumberland County [Durham is now in Androscoggin County], Maine
        images:
          - src: Bela01census1840a.jpg
          - src: Bela01census1840b.jpg
      - year: "1850"
        caption: >-
          Durham, Cumberland County [Durham is now in Androscoggin County], Maine - dwelling 122, family 136. In 1850,
          Thankful (Millbanks) Vining was living in the household of son William. It is unlikely, however, that she was
          87 years old in 1850.
        images:
          - src: Bela01census1850.jpg
  - type: death
    items:
      - caption: >-
          Gravestones of Thankful (Millbanks) Vining, and both Thankful and Bela Vining. The inscription on Bela
          Vining's stone (the right hand stone of the pair) is mostly below ground.
        images:
