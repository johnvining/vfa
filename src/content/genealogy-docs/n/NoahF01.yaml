  - type: notes
    heading: Note
    text: >-
      The monument for Mary Arabel Vining (and other members of her family) shows her birth year as 1899, but the census
      records reported her to be 11 years old in 1900, 21 in 1910, 31 in 1920, and 41 in 1930. Was the gravestone
      engraved incorrectly?
