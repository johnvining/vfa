      - year: "1860"
        caption: >-
          Weymouth, Norfolk County, Massachusetts - dwelling 733, family 837. Also living in this household in 1860 were
          Frances Barrett (40 y., b. Massachusetts) and L[u?]ren Barrett (30 y., b. Massachusetts).
        images:
          - src: NoahJr01census1860a.jpg
          - src: NoahJr01census1860b.jpg
      - year: "1870"
        caption: >-
          Weymouth, Norfolk County, Massachusetts - dwelling 1559, family 1894. Also living in this household in 1870
          was John F. Vining (b. April 1870, Massachusetts), a son of Noah Franklin Vining, who was presumably widowed.
        images:
          - src: NoahJr01census1870.jpg
      - year: "1880"
        caption: >-
          Weymouth, Norfolk County, Massachusetts - dwelling 337, family 418. Also living in this household in 1880 was
          John F. Vining (10 y.), a son of Noah Franklin Vining.
        images:
          - src: NoahJr01census1880.jpg
      - year: "1900"
        caption: >-
          Sophia Louise Vining (d. 1920), Allen Bradford Vining (d. 1925), and Sarah Catherine Vining (d. 1900) remained
          single until their deaths and are buried in Mount Hope Cemetery in Weymouth, Norfolk County, Massachusetts
          (see gravestone image below).
