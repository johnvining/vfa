      - year: "1850"
        caption: >-
          Weymouth, Norfolk County, Massachusetts - dwelling 9, family 9. Also living in this household in 1860 were
          Ellen Welsh (40 y., b. Ireland) and Jonathan White 2nd (19 y., b. Massachusetts).
        images:
