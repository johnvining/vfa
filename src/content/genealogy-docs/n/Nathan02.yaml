    entries:
      - year: "1850"
        caption: >-
          Cooper, Washington County, Maine - dwelling 35, family 36. In 1850, Nathan Vining, Mary Elizabeth (his wife),
          and their children Almira Helen, Percis, Emma A., and Nathan Jr. were living with Nathan's parents, Leavitt
          Vining and Hannah [...].
        images:
          - src: Nathan02census1850.jpg
      - year: "1860"
        caption: Cooper, Washington County, Maine - dwelling 15, family 14
        images:
          - src: Nathan02census1860.jpg
      - year: "1870"
        caption: >-
          Cooper, Washington County, Maine - dwelling 80, family 88. The only record found to date for any member of
          this family is the following one, which is for Almira Vining.
        images:
          - src: Nathan02census1870.jpg
      - year: "1880"
        caption: >-
          Cooper, Washington County, Maine - By 1880, Frederic H. Vining was married, and he and his wife (Edith E.) and
          their son (Otis Harland Vining, 1 m.) were living in the household of his parents. Also living in this
          household in 1880 were three children listed as grandchildren: Charles L. Vining (8 y.), Lillian Vining (7
          y.), and Fred Vining (5 y.).
        images:
          - src: Nathan02census1880.jpg
      - year: "1900"
        caption: >-
          Cooper, Washington County, Maine - dwelling 65, family 66. George B. Vining appears to have been in Minnesota
          in 1900 before returning to Cooper, Maine, where he remained single for the rest of his life. He is buried in
          Evergreen Cemetery in Cooper.
        images:
          - src: Nathan02census1900.jpg
