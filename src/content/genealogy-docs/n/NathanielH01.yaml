    entries:
      - year: "1870"
        caption: >-
          St. Albans, Somerset County, Maine - dwelling 210, family 213. Also living in this household in 1870 were two
          nephews of Nathaniel Haws Vining—Joshua C. Vining (19 y., b. Maine, "works on farm") and George W. Vining (22
          y., b. Maine, artist)—and his mother, Joann Vining (62 y., b. Maine).
        images:
          - src: NathanielH01census1870a.jpg
          - src: NathanielH01census1870b.jpg
      - year: "1880"
        caption: St. Albans, Somerset County, Maine - dwelling 44, family 44
        images:
          - src: NathanielH01census1880.jpg
      - year: "1900"
        caption: >-
          St. Albans, Somerset County, Maine - dwelling 206, family 207. Also living in this household in 1900 was [...]
          M. Stone (Anna L. (Stone) Vining's mother). Alice (Lowenstein) Vining (the wife of Seldon J. Vining and
          daughter-in-law of Nathaniel Haws Vining and Anna L. (Stone) Vining) and her two daughters (Marie Thelma
          Vining and Marjorie C. Vining) were reported in this St. Albans household in 1900 as well as in the household
          of (and with) Seldon J. Vining in Seattle (ward 8), King County, Washington.
        images:
          - src: NathanielH01census1900a.jpg
          - src: NathanielH01census1900b.jpg
      - year: "1910"
        caption: >-
          Seattle (ward 3), King County, Washington - dwelling 111, family 110. Anna L. Vining was living in the
          household of son Seldon J. Vining in 1910.
        images:
          - src: NathanielH01census1910.jpg
      - year: "1920"
        caption: >-
          St. Albans, Somerset County, Maine - dwelling 248, family 253. In 1920, Anna L. (Stone) Vining and daughter
          Florence R. (Vining) Chisholm were living in the household of daughter-in-law Clara Belle "Carrie" (Hanson)
          Vining (widow of Frank Newell Vining).
        images:
          - src: NathanielH01census1920.jpg
      - year: "1930"
        caption: St. Albans, Somerset County, Maine - dwelling 248, family 253
        images:
          - src: NathanielH01census1930.jpg
