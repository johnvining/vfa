          1820 census record.
      - year: "1830"
        caption: >-
          Weymouth, Norfolk County, Massachusetts. Each member of the family fits into the expected age category in the
          1830 census record except Allen, who was 22 in 1830 and not 15–19. Mary appears to be living with her parents
          in 1830 despite having been married in 1828. Given that there was no male of approximately Mary’s age in this
          household, it needs to be determined if Mary had been widowed. Further, it is to be determined who the two
          males (age 10–14 and age 80–89) were.
      - year: "1850"
        caption: >-
          Weymouth, Norfolk County, Massachusetts - dwelling 320, family 398. Also living in this household in 1850 were
          Olive Vining (85 y., b. Massachusetts), Charles V. White (15 y., b. Massachusetts, shoemaker), and Mary V.
          White (13 y., b. Massachusetts), the latter two likely grandchildren of Noah and Mary (Stoddard) Vining.
