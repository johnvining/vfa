    entries:
      - year: "1930"
        caption: >-
          Davisboro, Washington County, Georgia - dwelling 105, family 105. Also living in this household in 1930 was
          Lucy Vining (64 y., b. Georgia), the widowed mother of Julian Vining. In 1930, Tescola was reported to be 1
          month old. but in 1940, she was said to be 8 years old. To be determined if this is not uncommon approximate
          dating of the census or if there were two children, one who died young and a second one named for the earlier
          deceased child.
