sections:
  - type: notes
    heading: Note
    text: >-
      A newspaper obituary written by “a friend” said that John Sanders Vining and Elizabeth Louiza (Worthington) Vining
      has “fifteen children, six dying in infancy and six lived to be grown.” This leaves some question as to whether
      there were four or seven children not accounted for below.
