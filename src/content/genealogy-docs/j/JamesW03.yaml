      - year: "1855"
        caption: >-
          Cairo, Greene County, New York - dwelling 78, family 85. Also living in this household in 1855 was Hannah
          Vining (68 y., mother of James Washington Vining) and boarder [P?]olly Brown (47 y.). To be determined is who
          the mother of Alexander Vining was. James Washington Vining’s obituary mentions only three daughters as
          offspring, and none of James’s brothers seems to have had a son named Alexander.
