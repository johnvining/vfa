id: John13
title: John Vining - Sarah Ratcliff(e)
intro:
  - caption: Thank you to Victor Vining for his contributions to this page.
sections:
  - type: death
    items:
      - caption: "Will and codicil for John Vining (from Jefferson County, Georgia, Probate Court):"
        images:
          - src: John13willa.jpg
          - src: John13willb.jpg
  - type: research
    text: >-
      John's son Thomas was not mentioned in his father's will, but Zachariah, Thomas's son, was mentioned. Also, Jesse
      was named as John's “youngest son”. This suggests that John's son Thomas predeceased his father's making of his
      will, which was 26 April 1801. Research is needed regarding this possibility.
