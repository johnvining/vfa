  - type: death
    items:
      - caption: >-
          John and Mary (Goodwin) Vining's names appear on stones in two cemeteries in Durham, Androscoggin County,
          Maine. The oldest ones are in Old Town Cemetery and presumably mark the location of their graves. Their son
          Jonathan has a stone next to those of his parents in Old Town Cemetery. The names of John, Mary, and Jonathan
          also appear on a stone in Vining Cemetery in Durham that includes the name of John and Mary's daughter
          (Jonathan's sister) Sally. In addition, there is a Revolutionary War stone for John Vining in Vining Cemetery.
      - caption: >-
          Vining lot in Old Town Cemetery, followed by images of the individual stones. Left to right the stones are for
          Jonathan, John, and Mary.
        images:
          - src: John05cemlot.jpg
          - src: John05sonJonathangravestone.jpg
          - src: John05gravestone.jpg
          - src: John05wifegravestone.jpg
      - caption: >-
          Gravestones in Vining Cemetery, Durham, Androscoggin County, Maine. Although the names of Sally's parents and
          an older brother, Jonathan, appear on the stone, they are likely buried in Old Town Cemetery in Durham (see
          notes above).
        images:
          - src: John05headstone.jpg
          - src: John05revwarstone.jpg
        inline: true
