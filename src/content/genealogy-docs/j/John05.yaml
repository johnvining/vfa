      - year: "1800"
        caption: >-
          Durham, Cumberland County [Durham is now in Androscoggin County], Maine. It is not surprising, given the
          "approximate" nature of ages reported in censuses, that John Vining and wife Mary Goodwin, were reported as
          being "45 and over" when John was 37 or 38 and Mary was around 35. There are, however, several issues that
          need to be clarified. First is the determination of the identity of the M 16–26, and second is the whereabouts
          of John and Mary's four young sons-Benjamin (7), Samuel (5), John Jr. (2), and Reuben (1). Note that these
          four were in this household in 1810.
        images:
          - src: John05census1800.jpg
