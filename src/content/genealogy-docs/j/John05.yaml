id: John05
title: John Vining - Mary Goodwin
sections:
  - type: family
    items:
      - caption: >-
          The town of Durham, Androscoggin County, Maine, has photocopied its vital record books, and those photocopies
          are available for public viewing. Unfortunately, much of the photocopied material is very difficult to
          impossible to read. Below is the page (greatly enlarged) recording the family of John Vining and Mary Goodwin.
          The information on this page was entered by what appears to be at least two individuals. The earliest (and
          lightest) entries were made on 4 March 1865 by James Strout Jr., town clerk, and recorded events that occurred
          from a decade to nearly 80 years earlier. Information near the bottom of the page is for another family but is
          not excluded in order to show the name of the Town Clerk reported at the very bottom of the page.
        images:
          - src: John05Durhamrecordsp414.jpg
