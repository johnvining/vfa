  - type: research
    text: >-
      The 1910 census reported that Sarah Ann Nail (Alcox) Vining had given birth to 11 children, 10 of whom were living
      in 1910, but the above family group lists 13 children. How many children did Jesse Lawrence Vining and his wife
      have?
