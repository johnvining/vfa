    entries:
      - year: "1880"
        caption: >-
          Newark Township, Wilson County, Kansas - dwelling 129, family 135. Also living in this household in 1880 was
          Ella Vining (8 y., b. Kansas), a niece of James Vining.
        images:
          - src: JamesMJr01census1880.jpg
      - year: "1900"
        caption: Newark Township, Wilson County, Kansas - dwelling 86, family 89
        images:
          - src: JamesMJr01census1900.jpg
      - year: "1910"
        caption: Neodesha (ward 8), Wilson County, Kansas - dwelling 289, family 337
        images:
          - src: JamesMJr01census1910.jpg
      - year: "1920"
        caption: >-
          Neodesha (ward 1), Wilson County, Kansas - dwelling 113, family 121. Ernest Lester Vining, referred to in this
          census as “Lester J.”, was listed as “S”[ingle]. Also living in this household in 1920 was Gertrude Vining (8
          y., b. Kansas), a granddaughter of [Jane or Jennie] (Lindsley) Vining, probably a daughter of son Earl Vining,
          who was widowed in 1913.
        images:
          - src: JamesMJr01census1920.jpg
      - year: "1930"
        caption: >-
          Neodesha (ward 2), Wilson County, Kansas - dwelling 22, family 23. In 1930, Jennie (Lindsley) Vining was a
          “roomer” with a Beverly family.
        images:
          - src: JamesMJr01census1930.jpg
