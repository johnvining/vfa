id: Jonathan02
title: Jonathan Vining - Jane "Jennie" [Gurrell?]
sections:
  - type: marriage
    items:
      - caption: >-
          Two documents related to the marriage of Clarissa Vining, daughter of Jonathan and Jane "Jennie" ([Gurrell?])
          Vining, and Robert Morton. The first (from Windsor, Maine, record book 1, p. 375) reported that intentions of
          their marriage had been filed 14 days prior to 24 November 1826. The second (from Windsor, Maine, record book
          1, p. 391) reported on 24 April 1827 that they had been married at some point "since April 9, 1826".
        images:
          - src: Jonathan02Windsorrecordsb1p375.jpg
      - images:
          - src: Jonathan02Windsorrecordsb1p391.jpg
      - caption: >-
          Report (from Windsor, Maine, record book 1, p. 380) that intentions of marriage between Sally Vining and Henry
          Bryant had been filed 14 days prior to 25 August 1829:
        images:
          - src: Jonathan02Windsorrecordsb1p380.jpg
  - type: family
    items:
      - caption: "From book 1, page 132 of Windsor, Kennebec County, Maine, town records:"
        images:
          - src: Jonathan02Windsorrecordsb1p132.jpg
  - type: death
    items:
      - caption: >-
          The cemetery lot of Jonathan Vining's family. From left to right are the stones of Jonathan (broken into two
          pieces), his wife Jane, and their daughter Lucretia N. Following the image of the cemetery lot are the images
          of the individual stones. The stones are in Windsor Neck Cemetery, Windsor, Maine.
        images:
          - src: Jonathan02cemeterylot.jpg
          - src: Jonathan02gravestonetop.jpg
          - src: Jonathan02gravestonebottom.jpg
          - src: Jonathan02wifeJanegravest.jpg
          - src: Jonathan02dauLucretiagrave.jpg
