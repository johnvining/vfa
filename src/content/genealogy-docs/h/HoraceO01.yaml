id: HoraceO01
title: Horace Oscar Vining - Martha Harrison Chapman
sections:
  - type: death
    items:
      - caption: >-
          Fern (Alexander) Vining, Horace Oscar Vining's granddaughter-in-law, says in a letter written on 10 October
          1966 that he was killed by a bull. Note that his death was just over a month before his last child was born.
      - caption: >-
          Gravestone for Horace Oscar Vining, in Vining Cemetery, Old Frontenac, Goodhue County, Minnesota (from Find A
          Grave):
