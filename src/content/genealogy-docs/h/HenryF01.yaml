    entries:
      - year: "1880"
        caption: >-
          Newark, Wilson County, Kansas - Also living in this household in 1880 were Serilda Ashlock (12 y., b.
          Missouri) and Isaac Ashlock (7 y., b. Missouri), stepchildren of Henry Francis Vining. Julia Vining married in
          1892 and died in 1898.
