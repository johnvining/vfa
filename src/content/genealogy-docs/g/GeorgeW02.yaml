    entries:
      - year: "1860"
        caption: >-
          Weld, Franklin County, Maine - dwelling 87, family 83. In 1860, George W. Vining, his wife, and his daughter
          (Clara E. Vining) were living with his parents (Page Vining and Margaret Ring).
        images:
          - src: GeorgeW02census1860.jpg
      - year: "1870"
        caption: >-
          Weld, Franklin County, Maine - dwelling 5, family 5. Also living in this household in 1870 was Abia[h or l?]
          Jones (17 y., b. Maine), a farm laborer.
        images:
          - src: GeorgeW02census1870.jpg
      - year: "1880"
        caption: >-
          Weld, Franklin County, Maine - dwelling 10, family 12. Also living in this household in 1880 was Charles E.
          Vining (34 y., b. Maine), a brother of George W. Vining.
        images:
          - src: GeorgeW02census1880.jpg
      - year: "1900"
        caption: >-
          Weld, Franklin County, Maine - dwelling 103, family 107. In 1900, widower George W. Vining was living with his
          sister, Sarah Kennedy.
        images:
          - src: GeorgeW02census1900.jpg
