title: Otis Smith Vining - Minerva A. Storer
sections:
  - type: marriage
    items:
      - caption: >-
          Marriage intentions of Otis S. Vining and Minerva A. Storer, from Lisbon, Maine, town records. The dashed
          diagonal lines showing in the marriage intentions record are placed there by the town of Lisbon to show that
          it is not a certified record.
        images:
          - src: OtisS01andwifemarriageint.jpg
      - caption: >-
          Marriage record of George Thomas Vining (son of Otis S. Vining and Minerva A. (Storer) Vining) and Hattie T.
          Foster, from the Lisbon, Maine, town records. The dashed diagonal lines showing in the marriage record are
          placed there by the town of Lisbon to show that it is not a certified record.
        images:
          - src: OtisS01sonGeorgeTmarriage.jpg
      - caption: >-
          Marriage record of Harriet Jane Vining (daughter of Otis S. Vining and Minerva A. (Storer) Vining) and Charles
          H. Koepka, from Lisbon, Maine, town records. The dashed diagonal lines showing in the marriage record are
          placed there by the town of Lisbon to show that it is not a certified record.
        images:
          - src: OtisS01dauHarrietmarriage.jpg
      - caption: >-
          Marriage record of Martha Plummer Vining (daughter of Otis S. Vining and Minerva A. (Storer) Vining) and
          Benjamin F. Thorn, from Lisbon, Maine, town records. The dashed diagonal lines showing in the marriage record
          are placed there by the town of Lisbon to show that it is not a certified record.
        images:
          - src: OtisS01dauMarthamarriage.jpg
          - src: OtisS01dauClaramarriage.jpg
  - type: family
    items:
      - caption: >-
          The town of Durham, Androscoggin County, Maine, has photocopied its vital record books, and those photocopies
          are available for public viewing. Unfortunately, much of the photocopied material is very difficult to
          impossible to read. Below is the 27 February 1865 page (greatly enlarged) reporting the family of Otis S.
          Vining and Minerva A. Storer.
        images:
          - src: OtisS01Durhamrecordsp416.jpg
