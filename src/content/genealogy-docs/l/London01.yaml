id: London01
title: London Vining - Millie [...]
sections:
  - type: notes
    text: >-
      Because this is a black family, the 1870 census is likely the first of the decennial censuses to report them.
      Given the duplication of ages and arrangement of names in the census record, there may be two families here.
      Consistent with this hypothesis is that Susan and Andrew were the sole members of a household in the 1880 census,
      but their ages are lower that expected given the data of the 1870 census.
