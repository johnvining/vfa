    entries:
      - year: "1860"
        caption: >-
          Southwick, Hampden County, Massachusetts - dwelling 226, family 228. In 1860, Moses A. Vining, wife Eliza,
          daughter Dora, and son George were living in the household of William Brown.
        images:
          - src: MosesA01census1860.jpg
      - year: "1870"
        caption: >-
          Southwick, Hampden County, Massachusetts - dwelling 162, family 172. Also living in this household in 1870
          were Eliza Brown (58 y., b. Connecticut), Ella Brown (23 y., b. Massachusetts), and Alexander Blan[...?] (16
          y., b. Massachusetts, domestic servant).
        images:
          - src: MosesA01census1870.jpg
      - year: "1880"
        caption: >-
          Southwick, Hampden County, Massachusetts - Also living in this household in 1880 was Ella M. Brown (32 y., b.
          Massachusetts), a sister-in-law of Moses Andrew Vining.
        images:
