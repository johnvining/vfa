  - type: research
    text: >-
      According to the 1850 census, the age of Charles Vining, son of Moses P. Vining and Reliance T. (Soule) Vining,
      was 1 year. This is consistent with the 1860 census report of 10 years for his age. (Census records are often
      approximations of true ages.) His gravestone, however, reported his age at death (4 December 1862) to be 19 years
      and 9 months. This would have made Charles approximately 7 years old in 1850 and around 17 in 1860. Clarification
      is needed here.
