    entries:
      - year: "1900"
        caption: >-
          East Waterloo Township, Black Hawk County, Iowa - dwelling 665, family 730. Also living in this household in
          1900 were three of Isabelle Nettie Kays's children by her first marriage. James was also hers by that
          marriage, but he was later reported with the last name Vining.
        images:
          - src: MyronH01census1900.jpg
      - year: "1910"
        caption: >-
          East Waterloo Township, Black Hawk County, Iowa - dwelling 275, family 309. Also living in this household in
          1910 were Ralph Tait (36 y., b. Kansas, a lodger) and Robert Vining (40 y., b. Iowa, a brother of Myron Henry
          Vining).
        images:
          - src: MyronH01census1910.jpg
      - year: "1920"
        caption: >-
          East Waterloo Township, Black Hawk County, Iowa - dwelling 185, family 278. Also living in this household in
          1920 were Ralph R. Tate [sic] (45 y., b. Illinois [sic], a roomer) and Eadward Olds (54 y., b. Iowa, a roomer)
          plus Viola A. (Vining) Tracy and her husband and daughter.
        images:
          - src: MyronH01census1920.jpg
