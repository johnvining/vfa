      - caption: >-
          “Richard John Vining moved to the Alexandra area (formerly known as the Red Gate Diggings), Victoria,
          Australia, around 1866 and was the proprietor of the Alexandra Hotel. The building was originally designed to
          be a post office and a bank as well, going by the drawing [below] made by his son Walter Earnest.”
        images:
