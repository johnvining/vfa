id: Robert01
title: Robert Vining - Mary Reade
sections:
  - type: notes
    heading: Note
    text: >-
      Some researchers question whether the 1652 immigrant John Vining, from whom many North American Vinings descend,
      was the John Vining who was the son of Robert Vining of the White Horse Tavern because the White Horse was being
      operated by a John Vining after 1652.
