      - year: "1870"
        caption: >-
          Avon, Franklin County, Maine - dwelling 97, family 100. Also living in this household in 1870 was a John
          Vining (59, b. Maine), probably Converse's brother whose wife died 4 October 1869. (The non-Vining census
          information appears because the lower part of the J of John Vining's name descends into that row.)
        images:
          - src: ConverseW01census1870.jpg
      - year: "1880"
        caption: >-
          Avon, Franklin County, Maine - By 1880, Adelaide Julia Vining was married to Spaulding Hardy. She and
          Spaulding (32) were living with her parents along with their two sons Lewis (5) and Guy (4). In addition,
          there was a Lottie True living in the household.
