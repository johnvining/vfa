      - year: "1910"
        caption: >-
          Columbia, Jackson County, Michigan - dwelling 66, family 67. Beulah (Vining) Harris was living in this
          household with her parents. Also living in this household in 1910 was a granddaughter Vivian L. Vining (1 y.,
          3 m., b. Michigan).
        images:
          - src: CharlesF01census1910.jpg
      - year: "1920"
        caption: >-
          Jackson (ward 4, precinct 3), Jackson County, Michigan - dwelling 365, family 372. Also living in this
          household in 1920 were stepchildren Edith (24 y., b. Michigan), Kenneth (17 y., b. Michigan), and Geraldine
          (15 y., b. Michigan), all of whom had apparently taken Vining as their surname. Nephew Willard Howe (26 y., b.
          Michigan) and his wife, Marie (2[6?] y., b. Michigan), were also living in the household in 1920.
        images:
          - src: CharlesF01census1920.jpg
