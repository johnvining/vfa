      - year: "1860"
        caption: >-
          Cummington, Hampshire County, Massachusetts - dwelling 12, family 12. Emma[h?] D.'s surname was Bates in the
          1860 census, following her marriage to Wells H. Bates on 5 July 1855. Also living in this household in 1860
          was Lewis Latham (farm laborer, 63 y., b. Massachusetts).
        images:
