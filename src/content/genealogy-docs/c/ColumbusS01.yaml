  - type: research
    heading: "Research Opportunity:"
    text: >-
      Catherine Alcox was born to Jesse Alcox and Dora Ann Clemmons. After Jesse's death, his widow married John Page
      Bennett. To be determined is whether Catherine was adopted by her stepfather and/or whether her last name was
      legally changed to Bennett.
