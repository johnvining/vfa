id: Celia01
title: Celia Vining - Obadiah Stoddard
sections:
  - type: birth
    items:
      - caption: >-
          Baptism record of Celia Vining, 15 May 1758, Abington First Congregational Church records,
          1750-1774, p. 50. The clerk's format in this section lists names without parents. Source:
          <a href="https://congregationallibrary.quartexcollections.com/Documents/Detail/church-records-1750-1774-first-congregational-church-in-abington-mass./40726">Congregational Library</a>.
        images:
          - src: Celia01baptism1758.png
  - type: marriage
    items:
      - caption: >-
          Marriage record (Scituate town clerk's book): "Married by Rev'd Mr. Sam'l Niles, Obediah
          Stoddard of Scituate to Cilai Vining of Abington Janr. [29]th 1781." Rev. Niles was minister of
          Abington First Congregational Church. Source:
          <a href="https://www.ancestry.com/search/collections/2495/records/14777992">Ancestry</a>.
        images:
          - src: Celia01marriage1781.png
      - caption: >-
          Vital Records of Abington, Massachusetts to the Year 1850 (Vol. 2, p. 219):
          "Vining, Celai [dup. and int. Selah, dup. Vinaing] and Obediah Stodder of Scituate
          [int. Stodard of Setuate], Jan. 29 [dup. May 13], 1781 [dup. in Scituate]." Variant readings
          across the original record books. Source:
          <a href="https://www.ancestry.com/search/collections/61401/records/125724">Ancestry</a>.
        images:
          - src: Celia01abingtonvr.png
  - type: death
    items:
      - caption: >-
          Gravestone of Celia Vining Stoddard, Union Cemetery, Hanover, Plymouth County, Massachusetts.
          Inscription: "In Memory of Mrs. Celia Stoddard, Wife of Mr. Obadiah Stoddard, died Dec 18, 1843,
          Æt [age — illegible, reads 81 or 84]." Source:
          <a href="https://www.findagrave.com/memorial/31460884/celie-stoddard">Find A Grave Memorial #31460884</a>.
        images:
          - src: Celia01gravestone.png
