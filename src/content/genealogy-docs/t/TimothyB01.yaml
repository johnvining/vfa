    entries:
      - year: "1830"
        caption: >-
          Salisbury, Meigs County, Ohio - According to the 1830 census, there were in this household 2 males under five
          years, 1 male of five and under 10, and 2 females under five years in addition to Timothy Birum Vining and
          Harriet (Jones) Vining.
        images:
          - src: TimothyB01census1830.jpg
      - year: "1840"
        caption: >-
          Salisbury, Meigs County, Ohio - According to the 1840 census, there were no females under 15 years in this
          household.
        images:
