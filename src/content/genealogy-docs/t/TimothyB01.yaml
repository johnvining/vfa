      - year: "1870"
        caption: >-
          Rutland, Meigs County, Ohio - Also living in this household in 1870 were Lilley Cook (9 y., b. Ohio) and James
          Cook (7 y., b. Ohio), presumably children of Harriet Sina Vining and first husband Britton J. Cook, and
          Elizabeth Vining (86 y., b. Connecticut), likely the mother of Timothy Birum Vining.
        images:
          - src: TimothyB01census1870.jpg
      - year: "1880"
        caption: >-
          Rutland, Ohio (Meigs County) - Also living in this household in 1880 were Elizabeth Vining (26 y., b. Ohio;
          wife of Wallace D. Vining), Valey Vining (3 y., b. Ohio; daughter of Wallace D. and Elizabeth Vining), and
          James H. Cook (17 y., b. Ohio; grandson of Timothy Birum Vining and Sina Jones, presumably son of Harriet Sina
          Vining and first husband Britton J. Cook).
        images:
          - src: TimothyB01census1880.jpg
