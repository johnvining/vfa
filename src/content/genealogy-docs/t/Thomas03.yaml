    entries:
      - year: "1830"
        caption: >-
          Avon, Somerset County, Maine [Avon is now in Franklin County]. The age of each member of this family in 1830
          matches the expected age range in the 1830 census. Also living in this household in 1830 was a male 20–29.
      - year: "1840"
        caption: >-
          Avon, Franklin County, Maine. The age of each member of this family in 1840 matches the expected age range in
          the 1840 census.
      - year: "1850"
        caption: >-
          Avon, Franklin County, Maine - dwelling 103, family 105. Also living in this household in 1850 was Roxanna
          (Purrington) Vining (19 y., b. Maine), wife (married within year) of Seward Vining.
        images:
          - src: Thomas03census1850.jpg
      - year: "1860"
        caption: Avon, Franklin County, Maine - dwelling 242, family 246
        images:
