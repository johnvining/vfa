      - year: "1870"
        caption: >-
          Avon, Franklin County, Maine - dwelling 89, family 92. Either Frederick Augustus moved into his own household
          after his marriage and his parents also moved to live with him and his wife and children, or he continued to
          live in the same dwelling with his parents but was simply listed first in the 1870 census of that household.
        images:
