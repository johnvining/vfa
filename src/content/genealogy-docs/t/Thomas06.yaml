  - type: death
    items:
      - caption: >-
          Headstone for Thomas Vining, Fannie (Corbitt) Vining, and Robert L. Vining, in Red Bluff Cemetery, Pearson,
          Atkinson County, Georgia (from Find A Grave). Given that Fannie (Corbitt) Vining was reported in the 1930
          census (see above), her death year recorded on the headstone as 1929 is erroneous. A hypothesis is that all of
          the birth and death dates on the headstone were engraved at the same time, no earlier than April 1950, and by
          that time the death date of Fannie was recalled incorrectly.
