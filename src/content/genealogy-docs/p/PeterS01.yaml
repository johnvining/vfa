      - year: "1860"
        caption: >-
          Hunter (East Jewett post office), New York (Greene County) - dwelling 865, family 902. Also living in this
          household in 1860 were Mary Taylor (25 y., b. New York, domestic), Elijah Taylor (62 y., b. New York, farm
          laborer), and Albert More (50 y., b. New York, farm laborer).
        images:
