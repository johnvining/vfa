          - src: PeterS01census1860b.jpg
      - year: "1870"
        caption: >-
          Jewett, Greene County, New York - dwelling 117, family 125. Also living in this household in 1870 was
          Charlotte Rose (19 y., b. New York, domestic). James Washington Vining (18 y., b. New York) was a farm laborer
          in the household of George Powell and family (Jewett, Greene County, New York, dwelling 194, family 206).
        images:
