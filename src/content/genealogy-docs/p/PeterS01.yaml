id: PeterS01
title: Peter Smith Vining - Sarah Maria Hicks
sections:
  - type: notes
    text: >-
      A Carolyn Vining was reported to be a member of this household by Dorothea Vining Barnes in her 1980 book The
      Vining Family. Based on that book, she is included here but her presence in the census record has not been found
      yet.
