      - caption: >-
          Erastus Clarkson Vining and Elizabeth (Ritson) Vining and family: Front row (L to R): Ica Boraker (later
          married [...] Fullerton), Erastus Clarkson Vining, Elizabeth (Ritson) Vining, Annie Boraker Back row (L to R):
          Minnie (Boraker) Vining, Walter James Vining, Charles Augustus Vining, George Boraker, Lenna Boraker (later
          married [...] Stevens), Cora May (Vining) Boraker. Erastus Clarkson and Elizabeth in the front row are husband
          and wife. Their three children are Cora May (married George Boraker and had the three children in the photo),
          Walter James (married Minnie), and Charles Augustus.
