id: EbenezerW01
title: Ebenezer Willard Vining - Amelia Catherine Heath
intro:
  - caption: Thank you to Alicea Tell for her contributions to this page.
sections:
  - type: notes
    text: >-
      1. James M. Vining and Laura Ann Vining were children of Amelia Catherine (Heath) by Norman Wells, her first
      husband (who died). It is uncertain whether they were legally adopted by Ebenezer Willard Vining or simply took
      the surname Vining.


      2. No census record has been found for this family after 1870.
  - type: family
    items:
      - caption: >-
          Events in the life of Ebenezer Willard Vining: 1844 June 6 - delegate from Kane County, Illinois, at Second
          Democratic Convention of Fourth Illinois Congressional District, held at Ottawa (source: A Discourse on the
          Aborigines of the Ohio Valley) 1867 and 1869 - served as Mail Route messenger on Fox River Valley Line, an
          extension of the Galena & Chicago Union Railroad. (source: U. S. Philatelic Classics Society The Chronicle of
          the U.S. Classic Postal Issues, vol. 38, no. 3, p. 209.)
