    entries:
      - year: "1880"
        caption: >-
          - One hypothesis is that Elijah H. Vining Jr. was reported in two households in 1880—as age 19 years and still
          living in his parents' household (dwelling 18, family 18 in the 1261st District (Cedar Shoals), Newton County,
          Georgia); and as age 21 years and living with W. B. and Martha F[...] (family 171) in Brewer, Newton County,
          Georgia, when he was listed as a "clerk in store". Another hypothesis is that these were two Elijah H.
          Vinings, both living in Newton County, Georgia, in 1880. Research is needed to evaluate these
          hypotheses.Research is needed to evaluate these hypotheses.
