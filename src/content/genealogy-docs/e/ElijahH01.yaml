    entries:
      - year: "1860"
        caption: >-
          Snapping Shoals (post office), Newton County, Georgia - dwelling 37, family 37. Also living in this household
          in 1860 was Shadrack Vining (age 69 y., b. Georgia).
        images:
          - src: ElijahH01census1860.jpg
      - year: "1870"
        caption: Subdivision 96 (Covington post office), Newton County, Georgia - dwelling 922, family 43
        images:
          - src: ElijahH01census1870.jpg
      - year: "1880"
        caption: >-
          1261st District (Cedar Shoals), Newton County, Georgia - dwelling 18, family 18. One hypothesis is that Elijah
          H. Vining Jr. was reported in two households in 1880—as age 19 years and still living in his parents'
          household; and as age 21 years and living with W. B. and Martha F[...] (family 171) in Brewer, Newton County,
          Georgia, when he was listed as a "clerk in store". Another hypothesis is that these were two Elijah H.
          Vinings, both living in Newton County, Georgia, in 1880. Research is needed to evaluate these hypotheses.
        images:
          - src: ElijahH01census1880a.jpg
          - src: ElijahH01census1880b.jpg
