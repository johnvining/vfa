  - type: death
    items:
      - caption: >-
          Gravestone and military marker of Ebenezer Vining, in the Mt. Hope Cemetery in Rochester, Monroe County, New
          York. Although the gravestone is now broken and worn, the inscription was recorded on page 244 of Rochester: A
          Story Historical by Jenny Marsh Parker (Scranton, Wetmore and Company, Publishers and Book Sellers, 1884,
          Rochester, New York) as follows (line breaks are mine): "Rev. Ebenezer Vining "Born October 5th, 1754. "Died
          in Rochester, August 24, 1843. Aged 89. "He served his country in the Revolutionary struggle as a private
          soldier under the immediate command of General Washington; after which he united with the Baptist church in
          Leyden, Mass., and entered the work of the ministry, the duties of which he discharged until the 89th year of
          his age."
        images:
          - src: Ebenezer01gravestone.jpg
