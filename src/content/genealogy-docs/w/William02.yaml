        caption: >-
          Durham, Cumberland County [Durham is now in Androscoggin County], Maine - dwelling 122, family 136. Also
          living in this household in 1850 was Thankful Vining (87 y., b. Maine), William Vining's mother. (William's
          father, Bela Vining, died 17 February 1846.)
