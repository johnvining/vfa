    entries:
      - year: "1850"
        caption: >-
          Salem, Salem County, New Jersey - dwelling 215, family 219. Also living in this household in 1850 was Agnes
          Garrison (63 y., b. New Jersey). Research is needed to determine if this was the mother of Abigail H. ([...])
          Vining.
        images:
          - src: WilliamH09census1850.jpg
      - year: "1860"
        caption: Salem, Salem County, New Jersey - dwelling 595, family 612
        images:
          - src: WilliamH09census1860.jpg
      - year: "1870"
        caption: >-
          Mannington Township, Salem County, New Jersey - dwelling 55, family 59. Also living in this household in 1870
          were Caroline [...]elford (to become the wife of William H. Vining, 36 y., b. New Jersey) and her two children
          [of more?] Lydia [...]elford (12 y., b. New Jersey) and Capitola [Capitolia in 1880] [...]elford (10 y., b.
          New Jersey). Presumably as a result of the 1862 death of their mother, (at least) three of William H. and
          Abigail H. ([...]) Vining's children moved to other households and were reported from them in the 1870 census:
          William H. Vining (Mannington Township, Salem County, New Jersey - dwelling 86, family 89), Thomas Roan Vining
          (Upper Alloways Creek, Salem County, New Jersey - dwelling 236, family 232), and Levi D. Vining (Elsinboro,
          Salem County, New Jersey - dwelling 115, family 118).
        images:
          - src: WilliamH09census1870.jpg
      - year: "1880"
        caption: >-
          Salem (west ward), Salem County, New Jersey - dwelling 49, family 49. By 1880, Caroline [...]elford was the
          wife of William H. Vining, and Capatolia had taken on the surname of Vining.
        images:
          - src: WilliamH09census1880.jpg
      - year: "1890"
        caption: No census data available.
      - year: "1900"
        caption: >-
          Salem (west ward), Salem County, New Jersey - dwelling 201, family 201. From the 1900 census, it appears that
          William H. Vining (son of William H. Vining and Abigail H. [...]) was living in this household along with his
          son, William Jr. ([4?] y., b. New Jersey).
        images:
          - src: WilliamH09census1900.jpg
