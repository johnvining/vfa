id: WilliamJr01
title: William Vining Jr. - Anna Nichols
intro:
  - caption: Thank you to Ruby Daniels Gordon for her contributions to this page.
sections:
  - type: marriage
    items:
      - caption: >-
          Certified copy of the record of marriage of William Vining Jr. and Anna Nichols. Note the spelling of
          William's surname—Vinning.
        images:
          - src: WilliamJr01andwifemarrcert.jpg
  - type: research
    text: >-
      Several hypotheses have been proposed regarding the parentage of the William Vining who married Anna Nichols. The
      hypothesis proposed on this website (i.e., that he is the son of William Vining and Abigail Eldridge) is based on
      unpublished research of Ruby Daniels Gordon.
