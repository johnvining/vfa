id: WilliamHH01
title: William H. H. Vining - Mary Elizabeth Beal
sections:
  - type: research
    heading: Research opportunity
    text: >-
      According to the 1900 census, Mary Elizabeth (Beal) Vining, had given birth to two children, both of whom were
      living as of the 1900 census. However, this is not consistent with the report of the 1880 census. Did Mary
      Elizabeth (Beal) Vining have more children, or was William H. H. Vining married more than once?
