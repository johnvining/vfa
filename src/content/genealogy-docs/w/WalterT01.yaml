  - type: notes
    heading: "Note:"
    text: >-
      From a letter written by Bertha A. Vining on 17 October 1966:


      “Taught school in 1st and 4th grades of Kankakee Illinois schools + took nurse's training in St. Luke's
      (Episcopal) Hospital 14th & Michigan Ave., Chicago, — 1908 — graduated 1911. Practiced Registered Nursing as an
      Industrial Nurse before retiring from Illinois Bell Telephone Company's medical department. Am a veteran of
      U.S.A.N.C. in World War I. A member of the American Legion Post #270 of Chicago, Ill. — charter member — I served
      in France.”
