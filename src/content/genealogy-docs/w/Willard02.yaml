    entries:
      - year: "1900"
        caption: >-
          Pardeeville, Columbia County, Wisconsin - dwelling 5, family 5. In 1910, three of Willard and Josephine
          (Brownell) Vining's five children were living in the household of their paternal grandparents (Edward Kent
          Vining and Nancy O. Blatchley).
        images:
          - src: Willard02census1900.jpg
      - year: "1910"
        caption: >-
          In 1910, Philemon Vining was a "hired man" in the Marcellon, Columbia County, Wisconsin, household (dwelling
          127, family 127) of a Mitchell Family, and Celestia Parrisade Vining was an "inmate" in the "Wisconsin Home
          for Feeble Minded" in Lafayette Township, Chippewa County, Wisconsin.
        images:
          - src: Willard02census1910a.jpg
          - src: Willard02census1910b.jpg
      - year: "1920"
        caption: >-
          Wausaukee Township, Marinette County, Wisconsin - dwelling 282, family 283. In 1920, Willard Vining was living
          in the household of son Verne Terrence Vining.
        images:
          - src: Willard02census1920.jpg
