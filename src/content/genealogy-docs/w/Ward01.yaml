      - year: "1880"
        caption: >-
          Southwick, Hampden County, Massachusetts - Also living in this household in 1880 was John Cowles (66 y., b.
          Connecticut). In 1880, Morton Moore Vining was living with a Skinner family in Southwick, Hampden County,
          Massachusetts. That family was composed of Mary Jane Skinner (mother, 40 y.), Ida L. Skinner (daughter, 15 y.,
          likely the "Luella Skinner" that Morton Moore Vining married in 1881), Frank S. Skinner (son, 10 y.), Mary S.
          Skinner (daughter, 7 y.), and Charles E. Skinner (son, 5 y.). In 1880, Foster Vining was a servant in the
          household of an Isaac T. Webb family in Southwick, Massachusetts.
        images:
          - src: Ward01census1880.jpg
