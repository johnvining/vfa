    entries:
      - year: "1840"
        caption: >-
          Strong, Franklin County, Maine - The identity of the "additional" 5 individuals living in this household in
          1850 is unknown.
        images:
          - src: David06census1840.jpg
      - year: "1850"
        caption: Strong, Franklin County, Maine - dwelling 240, family 248
        images:
          - src: David06census1850.jpg
      - year: "1860"
        caption: >-
          Strong, Franklin County, Maine - dwelling 344, family 349. Charles H. Vining's family lived in the same
          dwelling as his mother, Jane C. (Thomas) Vining, and those siblings of his that were still living with her.
          Munzies R. Vining appears to have been listed twice in the 1860 census--both times as 28 years old--as a
          "gentlemen" in the household of his mother and also as a "flour dealer" living in Farmington, Maine, in the
          household of landlord Samuel F. Stoddard, dwelling 511, family 547.
        images:
          - src: David06census1860.jpg
      - year: "1870"
        caption: >-
          Strong, Franklin County, Maine - dwelling 56, family 61. Millard F. Vining was married, and he and wife Emma
          A. were living in this household in 1870.
        images:
          - src: David06census1870.jpg
      - year: "1880"
        caption: >-
          Strong, Franklin County, Maine - dwelling 215, family 236. In 1880, Jane C. (Thomas) Vining was living in the
          household of her daughter (Nancy) and son-in-law (Plementon Dagget Jr.).
        images:
          - src: David06census1880.jpg
