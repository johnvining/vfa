id: DouglasH01
title: Douglas Herbert Vining - Netye Douglas
sections:
  - type: census
    items:
      - caption: >-
          1950 US census, Douglas Vining household: Douglas (24, head), Pearl (26, wife), Ronald (3, son), Gary (2, son),
          and Donald (1, son). The household has three sons, no daughters &#8212; Joyce is not present, which together with
          her absence from Pearl Constant Vining Threeton's 2004 obituary indicates Joyce was not Pearl's daughter.
          Birth order of Pearl's sons: Ronald (b. ~1947), Gary (b. 1948), Donald (b. ~1949).
        images:
          - src: DouglasH01census1950.jpg
  - type: marriage
    items:
      - caption: >-
          Court News notice in <em>Tangi Talk</em>, Wednesday, 20 December 1967, recording &#8220;Douglas H. Vining v. Netye Douglas
          Sylvest Vining-sep.&#8221; (suit for separation). The form of Netye's name here &#8212; Douglas (her maiden), Sylvest
          (her previous married name), Vining (her then-current married name) &#8212; documents all three surnames in one entry.
          Source: <a href="https://www.newspapers.com/image/855025188/">Newspapers.com</a>.
        images:
          - src: DouglasH01courtnewsseparation.jpg
      - caption: >-
          Wedding announcement for Betsy Brown and Jeffrey Sylvest (son of Netye Douglas's earlier marriage to Marvin Sylvest of
          Picayune, Mississippi), published in <em>The Daily Star</em> (Hammond), Sunday, 30 December 1984; the couple married
          on Saturday, 17 November 1984 at the First United Methodist Church of Hammond, Rev. Glendon Messer officiating. Source:
          <a href="https://www.newspapers.com/image/1253727132/?article=9cac0686-09fe-45d2-9446-bfd1592ce50b">Newspapers.com</a>.
        images:
          - src: DouglasH01sonJeffreyweddingannouncement.jpg
  - type: death
    items:
      - caption: >-
          Obituary for Douglas Herbert Vining published in <em>The Daily Star</em> (Hammond), Sunday, 17 June 2001. Source:
          <a href="https://www.newspapers.com/image/1256214281/">Newspapers.com</a>.
        images:
          - src: DouglasH01obituary2001DailyStar.jpg
      - caption: "Earlier typed transcription of the same obituary text:"
        images:
          - src: DouglasH01obituary.jpg
      - caption: >-
          A fuller version of the obituary, published in <em>The Advocate</em> (Baton Rouge), 18 June 2001, with the spouse first
          names of all seven children (Joyce and Sidney Lawrence; Patricia and Charles Stevenson; Peggy and John Jarrell; Gary and
          Ann King Vining; Ronald and Patricia Woods Vining; Donald Vining; Jeffrey and Betsy Brown Sylvest) and the names of two
          predeceased grandsons (Alan and Steven Lawrence), transcribed at the
          <a href="http://files.usgwarchives.net/la/tangipahoa/obits/obitssur/vining.txt">USGenWeb Archives (Tangipahoa Parish, LA)</a>.
      - caption: >-
          Obituary for Douglas's first wife Pearl Constant Vining Threeton (1923–2004), published in <em>The Daily Star</em>
          (Hammond), Sunday, 21 March 2004; names her parents Sidney Joseph Constant and Norma Marie Kramer, her second husband
          Clifford A. Threeton, and her three surviving sons Gary P., Ronald M., and Donald D. Vining. Source:
          <a href="https://www.newspapers.com/image/1256071131/">Newspapers.com</a>.
        images:
          - src: DouglasH01wifePearlobituary2004DailyStar.jpg
      - caption: >-
          Gravestone for Douglas H. Vining, in Ponchatoula Cemetery, Ponchatoula, Tangipahoa Parish, Louisiana (from
          Find A Grave):
        images:
          - src: DouglasH01gravestone.jpg
      - caption: >-
          Joint Guiffreda headstone for Frank Donald Guiffreda (1929–2022) and Douglas's second wife Netye &#8220;Zel&#8221;
          Douglas Vining Guiffreda (1932–2024), in Ponchatoula Cemetery, Ponchatoula, Tangipahoa Parish, Louisiana. Source:
          <a href="https://www.findagrave.com/memorial/64436894/frank-donald-guiffreda#view-photo=37874706">Find A Grave Memorial #64436894</a>.
        images:
          - src: DouglasH01wifeNetyeandFrankGuiffredagravestone.jpg
      - caption: >-
          Obituary for Frank Donald Guiffreda (October 2022), husband of Douglas's sister Viola H. Vining (his first wife) and
          later of Douglas's widow Netye Douglas Vining (his second wife). Names &#8220;Peggy, Jeffrey, and Pat&#8221; as his
          stepchildren (i.e. Netye's biological children with their respective fathers) &#8212; a key source for Netye's family.
          Source: <a href="https://www.harrymckneely.com/obituaries/frank-donald-guiffreda">Harry McKneely &amp; Son Funeral Home</a>.
      - caption: >-
          Obituary for Douglas's second wife Netye &#8220;Zel&#8221; D. Guiffreda (3 November 1932 &#8211; 1 March 2024) at
          Harry McKneely &amp; Son Funeral Home, Ponchatoula. Confirms her maiden name Douglas (parents William Larkin Douglas
          and Henry Della [&#8230;]), her birthplace Logtown, Mississippi, and burial in Ponchatoula Cemetery. Source:
          <a href="https://obits.harrymckneely.com/netye-guiffreda">obits.harrymckneely.com</a>.
