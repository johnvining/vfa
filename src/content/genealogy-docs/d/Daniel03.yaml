  - type: death
    items:
      - caption: >-
          Cemetery lot of Daniel Vining's family. The large headstone in back belongs to Daniel Vining and his wives
          Sarah and Eliza, and the smaller stones in front, from left to right, belong to daughters Mary E. Vining and
          El[ea]nor [sic] M. Vining, and to sons Marcellus Vining and, on the back of Marcellus's stone, Reuben Vining.
          Following the image of the cemetery lot are images of the individual gravestones. These stones are in the
          Windsor Neck Cemetery in Windsor, Maine.
