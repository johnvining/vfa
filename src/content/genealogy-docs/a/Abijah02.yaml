    entries:
      - year: "1820"
        caption: >-
          Wayne, Steuben County, New York. The age of each member of this family in 1820 matches the expected age
          category in the 1820 census report.
      - year: "1830"
        caption: Urbana, Steuben County, New York. To be determined is the age of one (or two?) female(s) under 5.
      - year: "1840"
        caption: >-
          Genoa Township, Delaware County, Ohio. The reconstruction of this family from the 1840 census is likely
          correct for the males members of the family if they were all at home and no non-family members were living in
          the household. For Emily to have been 10–15 in 1840, she would have been 23–28 when she married (in 1853), a
          not unreasonable age. That leaves Louisa or Juliette to be the second female 15–20, and the identity of the
          female 5–10 is unknown.
        images:
          - src: Abijah02census1840a.jpg
          - src: Abijah02census1840b.jpg
      - year: "1850"
        caption: >-
          census district 21, Iroquois County, Illinois - dwelling 466. Also living in this household in 1850 was Oliver
          Baker (1 y., b. Illinois).
        images:
          - src: Abijah02census1850.jpg
      - year: "1860"
        caption: >-
          Limestone, Kankakee County, Illinois - dwelling 1852, family 1757. By 1860, Emmeline was married, and she and
          her daughter, Mary A[lice?]. Baker (9 y., b. Illinois), were living in this household.
        images:
          - src: Abijah02census1860.jpg
      - year: "1870"
        caption: >-
          Limestone, Kankakee County, Illinois - dwelling 144, family 144. Also living in this household in 1870 were
          farm laborer Alfred Bussey (32 y., b. Prussia), Emeline Baker (44 y., b. New York, “insane”), [Mary?] Alice
          Baker (18 y., b. Illinois), and Louisa Vining (30 [sic] y., b. New York, “insane”).
        images:
          - src: Abijah02census1870.jpg
