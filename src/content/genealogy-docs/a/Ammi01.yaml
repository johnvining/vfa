id: Ammi01
title: Ammi Vining - Susanna Gerrish
sections:
  - type: birth
    items:
      - caption: >-
          The town of Durham, Androscoggin County, Maine, has photocopied its vital record books, and those photocopies
          are available for public viewing. Unfortunately, much of the photocopied material is very difficult to
          impossible to read. Below is the page (greatly enlarged) recording the family of Ammi Vining and Susanna
          "Susan" Gerrish. The information on this page was entered by what appears to be three individuals. The
          earliest (and lightest) entries were made on 27 February 1865 by James Strout Jr., the town clerk, and
          recorded events that occurred from only a few to more than 50 years earlier.
        images:
          - src: Ammi01Durhamrecordsp419.jpg
