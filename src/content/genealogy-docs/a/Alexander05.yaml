      - year: "1910"
        caption: >-
          Athens, Greene County, New York - dwelling 340, family 381. According to the 1910 census, James M. Vining had
          been married for three years by 1910, but no mention is made of his wife. Also, following the death of Minnie
          (Vining) Garrison, her daughter (Ethel) was reported as having the surname Vining. Research is needed to
          determine if she (Ethel) was adopted by her grandparents.
