id: Alexander05
title: Alexander Vining - Alice Edwards
sections:
  - type: research
    text: >-
      Research is needed to determine the mother of Alexander Vining. In 1855, Alexander was living in a household with
      presumed father James Washington Vining, James’s mother (Hannah (Husted) Vining), and a Polly Brown. James
      Vining’s obituary mentions only three daughters as offspring, and none of James’s brothers seems to have had a son
      named Alexander.
