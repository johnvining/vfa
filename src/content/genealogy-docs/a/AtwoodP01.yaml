  - type: death
    items:
      - caption: >-
          Thank you to Carolyn Jones for the following information about the family of Harriet (Decker) Vining, which
          comes from the biography of William Henry Decker, a brother of Harriet (Decker) Vining: "PORTRAIT AND
          BIOGRAPHICAL RECORD. "WILLIAM HENRY DECKER, a lifelong resident of Lackawanna County. Catherine Snyder, mother
          of our subject, was born in Columbia County, N.Y., and died in July, 1891, at the age of seventy-five. She was
          of German descent and a daughter of John J. Snyder, who served in the War of 1812, came to Pennsylvania about
          1831 and settled at Blakely, where he engaged in farming until his death at eighty-one years. Eleven children
          were born to George and Catherine Decker, of whom the following attained mature years: William Henry;
          Catherine, Mrs. Evan S. Jones, of Scranton; Martin M., a blacksmith in this city; Harriet, Mrs. A. P. Vining,
          of Broome County, N.Y.; Mary, Mrs. Henry Earley, who died in Scranton; Mrs. Eliza Goble, who died in this
          city; George W., an engineer on the Delaware, Lackawanna & Western road; and Ella, widow of Thomas Tague, of
          Scranton."
