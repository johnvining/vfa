id: Samuel01
title: Samuel Vining - Sarah Devril
sections:
  - type: research
    heading: Research Opportunities
    text: >-
      1. Samuel Vining, son of immigrant ancester John, and wife Sarah Devril appear to be the first Vinings to move
      away from Weymouth, Norfolk County, Massachusetts. Samuel and Sarah’s first three children were born in Weymouth,
      but their fourth, Colaty, was born in Braintree, Norfolk County, Massachusetts.To be determined is when they
      (including the first three children?) moved to Braintree.


      2. Samuel and Sarah died in Connecticut. Oldest son Samuel Jr. likely died in Connecticut, and daughter Colaty
      married in Connecticut. To be determined is if Samuel, Sarah, and their four children all moved to Connecticut at
      the same time and, if so, where.
