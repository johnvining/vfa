  - type: family
    items:
      - caption: >-
          The town of Durham, Androscoggin County, Maine, has photocopied its vital record books, and those photocopies
          are available for public viewing. Unfortunately, much of the photocopied material is very difficult to
          impossible to read. Below is the page (greatly enlarged) recording the family of Samuel Vining and Mary
          “Polly” Smith. The information on this page was entered by what appears to be at least two individuals, but
          all the information on Samuel and Mary's family are by one person. These earliest (and lightest) entries were
          made on 5 February 1865 by James Strout Jr., the town clerk, and recorded events that occurred from a decade
          to nearly 70 years earlier.
        images:
          - src: Samuel05Durhamrecordsp415.jpg
