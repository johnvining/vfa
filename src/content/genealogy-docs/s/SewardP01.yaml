      - year: "1860"
        caption: >-
          Avon, Franklin County, Maine - dwelling 265, family 270. Henry C. Vining was a "farm laborer" for a Nourse
          family in Westboro, Worcester County, Massachusetts.
        images:
          - src: SewardP01census1860a.jpg
          - src: SewardP01census1860b.jpg
      - year: "1870"
        caption: >-
          Avon, Franklin County, Maine - dwelling 72, family 75. Ephraim Bernard Vining was listed first in the census
          of a household that included his wife (Ann) and child (Mabel) plus his parents (Seward and Martha) and three
          of his siblings (Sarah, Allie, and Fremont Seward). Nelson Eugene Vining was a "farm laborer" for a Phinney
          family in Wilton, Franklin County, Maine.
        images:
          - src: SewardP01census1870.jpg
