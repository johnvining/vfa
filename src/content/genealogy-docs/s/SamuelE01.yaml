title: Samuel E. Vining - Harriet A. Booth
sections:
  - type: census
    items:
      - caption: >-
          1865 Massachusetts state census, Booth household: Selden W. Booth (54), Harriet Booth (55, wife),
          Chas. E. Booth (24, son), and Hattie A. Booth (11, daughter) &#8212; &#8220;Hattie&#8221; being
          Harriet A. Booth, later the second wife of Samuel E. Vining. Her age 11 in the 1865 census is
          consistent with a birth in August 1853.
