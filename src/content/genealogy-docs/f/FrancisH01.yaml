        caption: >-
          Union Township, Woodward County, Oklahoma - dwelling 85, family 85. Also living in this household in 1910 were
          [...]ggie A. Brankel (mother-in-law of Francis Henry Vining, 36 y., b. Missouri), Efton Hawkins
          (brother-in-law of Francis Henry Vining, 14, b. Missouri), Flossie Hawkins (sister-in-law of Francis Henry
          Vining, 8, b. Missouri), and Annie Hawkins (sister-in-law of Francis Henry Vining, 2, b. Oklahoma).
