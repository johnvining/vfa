          sister (Hattie) and her parents were boarding in her household. The census reported that only four of Mary A.
          Vining’s children were living, one fewer than the previous census. Frank Clarke Jr. and Evelyn are the only
          two who cannot be accounted for in 1910, so one of them was presumably dead.
