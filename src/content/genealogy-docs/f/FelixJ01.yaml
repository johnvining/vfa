    entries:
      - year: "1880"
        caption: >-
          Shuck Pen (District 1039), Murray County, Georgia - dwelling 179, family 179. Also living in this household in
          1880 were George W. Cain (64 y., b. Georgia, father of Sarah Elizabeth (Cain) Vining), Nancy Cain (60 y., b.
          South Carolina, mother of Sarah Elizabeth (Cain) Vining), and Sarah Elizabeth (Cain) Vining's siblings Mary E.
          Cain (16 y., b. Georgia) and Samuel S. Cain (15 y., b. Georgia).
        images:
          - src: FelixJ01census1880.jpg
