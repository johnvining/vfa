id: IsraelL01
title: Israel L. Vining - Nancy J. Matthews
sections:
  - type: notes
    heading: Note
    text: >-
      Research is needed to determine why Israel L. Vining's name was reported as Ezra in the 1870 census. One
      hypothesis is that the similarity in sound of the two names was misunderstood by the census taker.
