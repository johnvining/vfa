    entries:
      - year: "1790"
        caption: >-
          Windsor, Berkshire County, Massachusetts. The age of each member of this family in 1790 matches the expected
          age category in the 1790 census record.
      - year: "1800"
        caption: Windsor, Berkshire County, Massachusetts
      - year: "1820"
