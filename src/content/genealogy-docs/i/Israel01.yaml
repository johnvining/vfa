  - type: military
    items:
      - caption: >-
          Mass. Secretary of State certification of Israel Vining's Revolutionary War service:
          (1) petition from Camp at Hull, 17 September 1776 (Vol. 55, p. 59, file N);
          (2) Capt. Isaac Thayer's co., Col. Thomas Marshall's regt., 17 June 1776 to 1 January 1777,
          town of Abington (Vol. 25, pp. 113 &amp; 91).
        images:
          - src: Israel01revwarservice.png
      - caption: >-
          Israel Vining of Cummington, Continental Army 1780. Age 20, 5 ft. 10 in., light complexion.
          Capt. Soaper, 22 July to 9 December 1780. From "Massachusetts Soldiers and Sailors of the
          Revolutionary War."
        images:
          - src: Israel01revwar1780.png
      - caption: >-
          Israel Vining's 1832 federal pension declaration (file no. 30179), sworn in Berkshire County,
          Massachusetts. Testifies he was born in Abington, Plymouth County. Source:
          <a href="https://catalog.archives.gov/id/111469408?objectPage=4">U.S. National Archives</a>.
        images:
          - src: Israel01pension1832.png
  - type: marriage
    items:
      - caption: >-
          Vining section, History of the Town of Hingham, Massachusetts (1893):
          "Israel, of Ab'n m. Feb. 4, 1782, Abia Dunbar." Source:
          <a href="https://archive.org/details/historyoftownofh00hing/page/272/mode/2up">archive.org</a>.
          Reliability concerns noted (see
          <a href="https://vitabrevis.americanancestors.org/2014/10/tackling-hingham-vital-records">Vita Brevis</a>).
        images:
          - src: Israel01hingham1893.png
  - type: birth
    items:
      - caption: >-
          Vital Records of Windsor, Massachusetts to the Year 1850 (Births p. 62):
          mass baptism of six children of Israel and Aba on 3 July 1808 — Eunice, Joseph, Israel
          (= Israel Royal), Cullen, "Miria" (= Mariah), and Ansel. Source:
          <a href="https://www.ancestry.com/search/collections/2495/records/30020321">Ancestry</a>.
        images:
          - src: Israel01windsorvrbirths.png
  - type: death
    items:
      - caption: >-
          Vital Records of Windsor, Massachusetts to the Year 1850 (Deaths p. 149):
          Aby, w. Israel, of consumption, Mar. 20, 1820, age 57 (C.R.);
          son Ansel, Nov. 1, 1799, age 10;
          ch. Israel, Mar. 23, 1799, age 2 months (= infant Israel Vining Jr., b. 21 Jan. 1799);
          inf. d. Ansel, Nov. 24, 1832;
          ch. Joseph and Betsey, Apr. 28, 1835;
          Israel, Apr. 15, 1840, age 81 (C.R.), gravestone (G.R.2) calls him "a Revolutionary Patriot."
          Source: <a href="https://www.ancestry.com/search/collections/61401/records/60010947">Ancestry</a>.
        images:
          - src: Israel01windsorvr.png
      - caption: >-
          Gravestones of Israel Vining and Abia (Dunbar) Vining, Bush Cemetery, Windsor, Berkshire County,
          Massachusetts. Source: Find A Grave.
        images:
          - src: Israel01gravestone.jpg
          - src: Israel01wifegravestone.jpg
        inline: true
