  <a name="JacksonC01"></a><font size=+2>Jackson Clarence Vining</font>
     (son of [?; see note below])
     b. 22 November [1864 or 1868?]   Richmond, Virginia
     m. (1) 10 October 1886   Flagstaff, Arizona
                 Anetta Maud Hoxworth
                       (dau. of George Hoxworth and Martha Morgan)
                       b. 10 July 1868   Ohio
                       d. 7 March 1901   Colorado Springs, Colorado
                             bur. Fairmount Cemetery   Denver, Colorado
           (2) 5 October 1904
                 Elizabeth Moran
                       b. age 38 y. as of 1910 census   Wisconsin
               divorced   1912
           (3) Margaret Lula Warford
                       (dau. of Wilson Warford and Lucinda Lou Houseworth)
                       b. 12 May 1878   Fort Scottt, Bourbon County, Kansas
                       d. 14 January 1936   Los Angeles, California
     d. 2 March 1936   Washington, District of Columbia
           bur. Fairmount Cemetery   Denver, Colorado
  
