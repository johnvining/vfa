    entries:
      - year: "1910"
        caption: >-
          Guilford Township, Wilson County, Kansas - dwelling 92, family 92. In 1910, Nellie A. Vining, a younger sister
          of Ralph Warren Vining, was listed in this household (see image below) as well as in the household of her
          parents (Fall River Township, Wilson County, Kansas). Also living in this household in 1910 was Henry Varner
          (12 y., b. West Virginia), son of Elizabeth (Brown) (Varner) Vining by her first marriage.
        images:
          - src: RalphW01census1910.jpg
      - year: "1920"
        caption: >-
          Guilford Township, Wilson County, Kansas - dwelling 62, family 62. Also living in this household in 1920 was
          Henry Varner (21 y., b. West Virginia), son of Elizabeth (Brown) (Varner) Vining by her first marriage.
        images:
          - src: RalphW01census1920.jpg
      - year: "1930"
        caption: Guilford Township, Wilson County, Kansas - dwelling 82, family 86
        images:
          - src: RalphW01census1930.jpg
      - year: "1940"
        caption: >-
          Guilford, Wilson County, Kansas. Also living in this household in 1940 were Frances Vining (wife of Ray W.
          Vining; 24 y., b. Kansas) and Donna Vining (daughter of Ray W. and Frances, 6 y., b. Kansas).
        images:
          - src: RalphW01census1940.jpg
