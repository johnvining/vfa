id: Reuben01
title: Reuben Vining - Mercy Lunt
sections:
  - type: family
    items:
      - caption: >-
          The town of Durham, Androscoggin County, Maine, has photocopied its vital record books, and those photocopies
          are available for public viewing. Unfortunately, much of the photocopied material is very difficult to
          impossible to read. Below is the page (greatly enlarged) recording the family of Reuben Vining and Mercy Lunt.
          The information on this page was entered by what appears to be three individuals. The earliest (and lightest)
          entries were made on 27 February 1865 by James Strout Jr., the town clerk, and recorded events that occurred
          from a decade to more than 60 years earlier.
        images:
          - src: Reuben01Durhamrecordsp418.jpg
