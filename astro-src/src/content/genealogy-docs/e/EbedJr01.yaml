    entries:
      - year: "1820"
        caption: >-
          Abington, Plymouth County, Massachusetts - Also living in this household in 1820 was either a male 16–18, who
          would also have been included in the "male 16–26" category, or two males, one 16–18 and one 16–26 (but not
          included in the "male 16–18" category).
