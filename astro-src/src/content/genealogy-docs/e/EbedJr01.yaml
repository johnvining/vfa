      - year: "1840"
        caption: Abington, Plymouth County, Massachusetts. Ebed Jr. was incorrectly recorded as M 40–50; he was 52 in 1840.
        images:
          - src: EbedJr01census1840.jpg
      - year: "1850"
        caption: >-
          Abington, Plymouth County, Massachusetts - dwelling 791, family 1014. Almira (Vining) Mann was married and
          living in a separate household, but the household was in the same dwelling as her parents. Ebed III (called
          Ebed Jr.) in the 1850 census was reported as living in the household of Almira (Vining) Mann.
        images:
          - src: EbedJr01census1850.jpg
      - year: "1870"
        caption: >-
          Abington, Plymouth County, Massachusetts - dwelling 640, family 797. Sally (Hobart) Vining was living in the
          household of daughter Sarah (Vining) Crocker in 1870.
        images:
          - src: EbedJr01census1870.jpg
