  - type: other
    heading: Biographical Notes
    text: >-
      (from Cherokee County [Texas] History, publication date not given):


      “Benjamin lived successively in Jefferson County, Morgan County, Habersham County, during the Georgia gold rush,
      and then in Campbell County. He was a silversmith. In 1839 he and two sons, Cosby and Lewis Milton, emigrated to
      the Republic of Texas and obtained land in the part of Nacogdoches which became Cherokee County in 1846. Cosby
      Vining was a medical doctor, a Justice of the Inferior Court in Harris Co., Ga., in 1828–29, and the first Sheriff
      of Cherokee County in 1846. Lewis Milton and Cosby Vining were soldiers in the brief Creek War of 1836.” (p. 574.)
