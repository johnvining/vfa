id: BillyJ01
title: Billy Joe Vinning and […]
sections:
  - type: notes
    heading: "Note:"
    text: >-
      The following explanation of the spelling of the surname as “Vinning” comes from Chad Vinning, a grandson of Billy
      Joe Vinning (via Daniel Vinning): “[W]hen my grandfather [Billy Joe] joined the Air Force, an error occurred on
      his identification record and well … it kinda just stuck. We were the “two n&#8217s” at Vining reunions in
      Willacoochee, GA. I like to say one of the n’s is silent.”
