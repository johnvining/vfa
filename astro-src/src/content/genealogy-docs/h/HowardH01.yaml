id: HowardH01
title: Howard Herman Vining - Fern Ione Alexander
intro:
  - caption: >-
      According to a 10 October 1966 letter written by Fern Ione (Alexander) Vining, Howard Herman Vining was “a letter
      carrier until January 2 [1966], when he fell down our son’s stairs and broke his knee. He was in the hospital for
      five months, and has had to go into clerking, as he cannot walk well, yet, and will never carry mail again.” She
      worked at “Sibley High School as Secretary to the Director of Elementary Education and for the Food Services
      Supervisor.”
