  - type: research
    text: >-
      In the 1860 census, Daniel was reported to be living in the household of his parents. In the 1870 census, he was
      reported to be married and have an 11-year-old son (Elmer, thought to have been born on 13 February 1858). If
      Elmer was 11 years old in 1870, where were he and his mother in 1860?


      Robert Edward Vining . . .


      received special mention at the tenth annual graduation exercises (10 June 1937) of the University of Baltimore
      (Maryland).


