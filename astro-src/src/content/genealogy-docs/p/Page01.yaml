id: Page01
title: Page Vining - Margaret Ring
sections:
  - type: notes
    text: >-
      The “Early Vital Records / 1741–1836” of Lewiston, Maine, reported the birth date of Page Vining to be “March 29th
      1803&#8221, but the headstone that Page shares with his wife gives the date as “Mar. 28, 1803.” However, both of
      these sources are from well after the date in question. Research is needed to determine the correct date.
