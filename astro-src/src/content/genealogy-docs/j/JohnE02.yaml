      - year: "1910"
        caption: >-
          Fort Wayne (ward 5), Allen County, Indiana - dwelling 314, family 315. In 1910, Joseph A. Vining was living in
          the household of Alexander Vining, his oldest brother.
        images:
          - src: JohnE02census1910.jpg
      - year: "1920"
        caption: >-
          Fort Wayne (ward 8), Allen County, Indiana - dwelling 199, family 202. By 1920, Ethel I. Vining was married,
          and she and husband and children were living in the household of her parents.
        images:
          - src: JohnE02census1920.jpg
      - year: "1930"
        caption: >-
          Fort Wayne (ward 8), Allen County, Indiana - dwelling 20, family 22. Also living in this household in 1930 was
          James Vining (18 y., b. Indiana), a grandson of John Elmer Vining and Florence M. (Payne) Vining.
        images:
          - src: JohnE02census1930.jpg
      - year: "1940"
        caption: >-
          Fort Wayne, Allen County, Indiana. By 1940, Elmer E Vining was married, and he and his wife were living with
          his parents.
