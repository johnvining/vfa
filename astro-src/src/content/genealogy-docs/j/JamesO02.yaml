      - year: "1920"
        caption: >-
          Douglas, Coffee County, Georgia - dwelling 79, family 82. Also living in this household in 1920 were four
          individuals listed as sons and daughters, but they carry a different surname, possibly children of James O.
          Vining's second wife by her first marriage. Also there were many boarders in the household. In 1920, following
          the death of his mother, James Chandler Vining was living with his maternal grandmother.
