sections:
  - type: notes
    heading: Note
    text: >-
      Gordon Francis Vining: Although the 1900 census reports his name as “Gordon” and the 1910 census reports his name
      as “James G.”, his real name seems to be “Gordon Francis”. See his draft card below and also the application
      (front and back) for his military gravestone. (Thank you to Cathy Cunningham for the following images and for her
      information about Gordon Francis Vining's name.)
