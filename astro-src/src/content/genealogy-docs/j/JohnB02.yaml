      - year: "1870"
        caption: >-
          Lynn (ward 5), Essex County, Massachusetts - dwelling 1037, family 1285. The Emma who was age 2 in the 1860
          census was apparently dead by the 1870 census, given the existence of a three-year-old Emma D. in this census.
        images:
          - src: JohnB02census1870.jpg
      - year: "1880"
        caption: >-
