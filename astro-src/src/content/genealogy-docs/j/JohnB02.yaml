      - year: "1860"
        caption: >-
          Lynn (ward 4), Essex County, Massachusetts - dwelling 1624, family 2173. Also living in this household in 1860
          was Abigail Weed (52 y., b. Massachusetts, thought to be the mother of John Blake Vining's first wife).
