  - type: research
    text: >-
      According to the 1910 census, Homer T. Vining [Thomas Homer Vining] ("son" of Sarah Elizabeth Vining) was reported
      to be married ("M1", meaning his first marriage) 0 years. In the same household was Bertha Vining ("daughter in
      law" of Sarah Elizabeth Vining), also married ("M1") 0 years. Also in the household was Annie Pearl Vining, a
      "grandaughter" [sic] of Sarah E. Vining. Now, Annie Pearl was reported to be 3 years old, and Bertha was reported
      to have been the mother of "0" children. The question, then, is who are the parents of Annie Pearl? Note: the only
      other members of the household in 1910 were Lucy Williams (81 y., widowed, the "mother" of Sarah Elizabeth Vining)
      and Carlton Berry Vining (20 y., single, a "son" of Sarah Elizabeth Vining).
