    entries:
      - year: "1790"
        caption: >-
          East Windsor, Hartford County, Connecticut. The age of each member of this family in 1790 matches the expected
          age category in the 1790 census report.
      - year: "1810"
        caption: >-
          Windsor, Hartford County, Connecticut - The presence of a male under 10 and a female under 10 as well as a
          second male 26–45—Alvin was probably the other—suggests that Alexander Jr., who married in 1807, and his
          family (but not his wife) were living in this household. Consistent with this hypothesis is that in 1830, two
          years after the death of Alexander Sr., a household headed by an "Alexander Vining" (likely Alexander Jr.) was
          still in East Windsor, Connecticut, and in that household was a female 60–70 (probably the widow of Alexander
          Sr.).
        images:
          - src: Alexander01census1810.jpg
      - year: "1820"
        caption: >-
          East Windsor, Hartford County, Connextixut. The hypothesis here is that Alexander Jr. and his family were
          living in this household and that Alvin (age 37) was living elsewhere.
        images:
          - src: Alexander01census1820.jpg
      - year: "1830"
        caption: >-
          East Windsor, Hartford County, Connecticut. Following the death of Alexander Sr. in 1828, Alexander Jr. was
          listed in the 1830 census as the "head" of the household. Consequently, a new census table for Alexander Jr.'s
          family begins with the 1830 census, and he is artificially reported above to be "married and living in
          separate household" even though that household is really a seamless continuation of the one above.
