    entries:
      - year: "1870"
        caption: >-
          Columbia, Jackson County, Michigan - dwelling 69, family 71. Also living in this household were Conelius
          Vining (53 y., b. New York), his wife (Zipporah (Clarke) Vining, 52 y., b. New York), and five of their
          children: Frank (23 y., b. Indiana), Charles (21 y., b. Idiana), Alice (18 y., b. Michigan), Thomas (13 y., b.
          Michigan), and Joseph (11 y., b. Michigan).
