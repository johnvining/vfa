name: Build and Deploy

on:
  push:
    branches: [astro]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout astro branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: astro-src/package-lock.json

      - name: Install dependencies
        working-directory: astro-src
        run: npm ci

      - name: Build
        working-directory: astro-src
        run: npm run build

      - name: Deploy to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Capture astro SHA before switching branches
          ASTRO_SHA=$(git rev-parse --short HEAD)

          # Stash built output before switching branches
          cp -r astro-src/dist /tmp/site-dist

          git checkout main

          # Remove old site files (preserve .git and astro-src)
          find . -maxdepth 1 -not -name '.git' -not -name 'astro-src' -not -name '.' -exec rm -rf {} +

          # Copy new output
          cp -r /tmp/site-dist/. .

          git add -A
          git diff --cached --quiet || git commit -m "deploy: build from astro branch ${ASTRO_SHA}"
          git push origin main
